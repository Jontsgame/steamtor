<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anfragen Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #3ecf8e; --danger: #ff4d4f; --bg: #f9fafb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 40px 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 1.8rem; }
        .grid { display: grid; gap: 15px; }
        .request-card { 
            background: white; padding: 20px; border-radius: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); border: 1px solid #eee;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .content { font-size: 1.1rem; font-weight: 500; }
        .date { font-size: 0.8rem; color: #999; margin-top: 5px; }
        .delete-btn { 
            background: #fff; color: var(--danger); border: 1px solid var(--danger);
            padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .delete-btn:hover { background: var(--danger); color: white; }
        .empty { text-align: center; color: #999; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Offene Anfragen</h1>
            <small id="status">Lade Daten...</small>
        </header>

        <div id="requestList" class="grid">
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://prjrsoclymkniaecasli.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Lk8fQGjfZ1QZRLKu8Af52A_EgGAOf2Q';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchRequests() {
            const { data, error } = await supabaseClient
                .from('requests')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return console.error(error);

            const list = document.getElementById('requestList');
            document.getElementById('status').innerText = `${data.length} Anfragen gefunden`;
            
            if (data.length === 0) {
                list.innerHTML = '<div class="empty">Keine Anfragen vorhanden.</div>';
                return;
            }

            list.innerHTML = data.map(req => `
                <div class="request-card">
                    <div>
                        <div class="content">${escapeHtml(req.content)}</div>
                        <div class="date">${new Date(req.created_at).toLocaleString('de-DE')}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteReq(${req.id})">Erledigt</button>
                </div>
            `).join('');
        }

        async function deleteReq(id) {
            if(!confirm("Als erledigt markieren und löschen?")) return;
            
            const { error } = await supabaseClient
                .from('requests')
                .delete()
                .eq('id', id);

            if (error) alert(error.message);
            else fetchRequests();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.onload = fetchRequests;
    </script>
</body>
</html>
